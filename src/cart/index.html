<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Cart</title>

    <link rel="stylesheet" href="/css/style.css" />

    <script src="../js/cart.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header">
    </header>

    <main class="divider">
      <section class="products" aria-labelledby="cart-heading">
        <p id="cart-status" role="status" aria-live="polite"></p>
        <h1 id="cart-heading">My Cart</h1>

        <p id="empty-cart-message" hidden>
          Your cart is empty.
          <a href="/index.html">Continue shopping</a>
        </p>

        <ul class="product-list" aria-label="Shopping cart items">
        </ul>
        <div class="cart-footer hide">
          <p class="cart-total"></p>
          <a href="/checkout/index.html"> Checkout</a>
        </div>
      </section>
    </main>

    <footer id="main-footer">
      <!-- &copy;NOT a real business -->
    </footer>
  </body>
</html>
