<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Cart</title>

    <link rel="stylesheet" href="/css/style.css" />

    <script src="../js/cart.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header">
    </header>

    <main class="divider">
      <section class="products" aria-labelledby="cart-heading">
        <p id="cart-status" role="status" aria-live="polite"></p>
        <h1 id="cart-heading">My Cart</h1>

        <p id="empty-cart-message" hidden>
          Your cart is empty.
          <a href="/index.html">Continue shopping</a>
        </p>

        <ul class="product-list" aria-label="Shopping cart items">
        </ul>
        <div class="cart-footer hide">
          <p class="cart-total"></p>

          <form id="checkout-form">
          <label for="fname">First Name</label>
          <input type="text" id="fname" name="fname" required/>
          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="lname" required/>
          <label for="street">Street Address</label>
          <input type="text" id="street" name="street" required/>
          <label for="city">City</label>
          <input type="text" id="city" name="city" required/>
          <label for="state">State</label>
          <input type="text" id="state" name="state" required/>
          <label for="zip">Zip</label>
          <input type="text" id="zip" name="zip" required/>
          <label for="cardNumber">Card Number</label>
          <input type="text" id="cardNumber" name="cardNumber" required/>
          <label for="expiration">Card Expiration</label>
          <input type="text" id="expiration" name="expiration" required/>
          <label for="code">Card CVV</label>
          <input type="text" id="code" name="code" required/>

          <p>Subtotal: $<span id="subtotal">0.00</span></p>

          <p>Tax: $<span id="tax">0.00</span></p>
          <p>Shipping: $<span id="shipping">0.00</span></p>
          <p>Order Total: $<span id="orderTotal">0.00</span></p>

          <button type="submit">Submit Order</button>

          </form>

        </div>
      </section>
    </main>

    <footer id="main-footer">
      <!-- &copy;NOT a real business -->
    </footer>
  </body>
</html>
