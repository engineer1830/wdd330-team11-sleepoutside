<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Wish List</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/wishlist.js" type="module"></script>
  </head>
  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <section class="products" aria-labelledby="wishlist-heading">
        <h1 id="wishlist-heading">My Wish List</h1>
        <p id="empty-wishlist-message" hidden>
          Your wish list is empty. <a href="/index.html">Start shopping</a>
        </p>
        <ul
          class="product-list wishlist-list"
          aria-label="Wish list items"
        ></ul>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
